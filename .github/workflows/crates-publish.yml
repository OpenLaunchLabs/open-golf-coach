name: Crates.io Package

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/crates-publish.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to crates.io'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ============================================
  # Validate crate metadata and packaging
  # ============================================
  validate:
    name: Validate crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-crates-validate-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-crates-validate-

      - name: Dry-run publish
        run: cargo publish --dry-run -p opengolfcoach

      - name: List package contents
        run: cargo package --list -p opengolfcoach

  # ============================================
  # Publish to crates.io
  # ============================================
  publish:
    name: Publish to crates.io
    needs: [validate]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'rc')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    environment:
      name: crates-io
      url: https://crates.io/crates/opengolfcoach
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish -p opengolfcoach
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
